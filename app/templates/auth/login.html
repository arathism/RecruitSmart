{% extends "base.html" %}
{% block title %}Sign In - Recruit Smart{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card-premium">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Welcome Back</h2>
                    <p style="color:#64748b;">Sign in to your account</p>
                </div>
                <form method="POST" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control form-control-lg" style="border-radius:12px;" placeholder="you@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" style="border-radius:12px;" placeholder="Enter your password" required>
                    </div>
                    <div class="mb-3 d-flex justify-content-end align-items-center">
                        <a href="{{ url_for('auth.forgot_password') }}" style="color:var(--primary);text-decoration:none;">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn btn-premium w-100 btn-lg">Sign In</button>
                </form>
                <div class="text-center mt-4">
                    <p style="color:#64748b;">Don't have an account? <a href="{{ url_for('auth.register') }}" style="color:var(--primary);text-decoration:none;font-weight:600;">Get Started</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
