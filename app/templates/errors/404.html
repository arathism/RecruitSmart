{% extends "base.html" %}
{% block title %}404 Error - Recruit Smart{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="card-premium py-5">
        <h1 class="display-1 fw-bold" style="color:var(--primary);">404</h1>
        <p class="lead text-muted mb-4">
            {% if error_code == '404' %}Page not found{% elif error_code == '500' %}Internal server error{% else %}Too many requests{% endif %}
        </p>
        <a href="{{ url_for('main.index') }}" class="btn btn-premium">Go Home</a>
    </div>
</div>
{% endblock %}
