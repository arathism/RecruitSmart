{% extends "base.html" %}
{% block title %}Reset Password - Recruit Smart{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card-premium">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Choose a New Password</h2>
                    <p style="color:#64748b;">Enter and confirm your new password below</p>
                </div>
                <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">New Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" style="border-radius:12px;" placeholder="At least 8 characters" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Confirm New Password</label>
                        <input type="password" name="confirm_password" class="form-control form-control-lg" style="border-radius:12px;" placeholder="Re-enter your new password" required>
                    </div>
                    <button type="submit" class="btn btn-premium w-100 btn-lg">Reset Password</button>
                </form>
                <div class="text-center mt-4">
                    <p style="color:#64748b;"><a href="{{ url_for('auth.login') }}" style="color:var(--primary);text-decoration:none;font-weight:600;">Back to Sign In</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
