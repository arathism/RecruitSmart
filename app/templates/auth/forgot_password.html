{% extends "base.html" %}
{% block title %}Forgot Password - Recruit Smart{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card-premium">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Reset Password</h2>
                    <p style="color:#64748b;">Enter your email to receive reset instructions</p>
                </div>
                <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control form-control-lg" style="border-radius:12px;" required>
                    </div>
                    <button type="submit" class="btn btn-premium w-100 btn-lg">Send Reset Link</button>
                </form>
                <div class="text-center mt-4">
                    <a href="{{ url_for('auth.login') }}" style="color:var(--primary);text-decoration:none;"><i class="fas fa-arrow-left me-1"></i>Back to Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
