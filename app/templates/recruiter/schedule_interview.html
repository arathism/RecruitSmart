{% extends "base.html" %}
{% block title %}Schedule Interview - Recruit Smart{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card-premium">
                <h3 class="fw-bold mb-1">Schedule Interview</h3>
                <p class="text-muted mb-4">{{ match.resume.user.get_full_name() }} &middot; {{ job.title }}</p>
                <form method="POST" action="{{ url_for('recruiter.schedule_interview', match_id=match.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Interview Type</label>
                        <select name="interview_type" class="form-select">
                            <option value="video">Video Call</option>
                            <option value="phone">Phone Call</option>
                            <option value="in_person">In Person</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Date &amp; Time *</label>
                        <input type="datetime-local" name="scheduled_at" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Duration (minutes)</label>
                        <input type="number" name="duration" class="form-control" value="60">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Location (if in person)</label>
                        <input type="text" name="location" class="form-control" placeholder="Office address">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Meeting Link (if video)</label>
                        <input type="url" name="meeting_link" class="form-control" placeholder="https://meet.google.com/...">
                    </div>
                    <button type="submit" class="btn btn-premium"><i class="fas fa-calendar-check me-2"></i>Schedule Interview</button>
                    <a href="{{ url_for('recruiter.view_candidates', job_id=job.id) }}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
