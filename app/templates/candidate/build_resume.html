{% extends "base.html" %}
{% block title %}Build Resume - Recruit Smart{% endblock %}
{% block content %}
<div class="container py-5">
    <h3 class="fw-bold mb-4">Build Your Resume</h3>
    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="card-premium mb-4">
            <h5 class="fw-bold mb-3">Personal Details</h5>
            <div class="row g-3">
                <div class="col-md-6"><input type="text" name="full_name" class="form-control" placeholder="Full Name" required></div>
                <div class="col-md-6"><input type="email" name="email" class="form-control" placeholder="Email" required></div>
                <div class="col-md-6"><input type="text" name="phone" class="form-control" placeholder="Phone"></div>
                <div class="col-md-6"><input type="text" name="location" class="form-control" placeholder="Location"></div>
            </div>
        </div>

        <div class="card-premium mb-4">
            <h5 class="fw-bold mb-3">Professional Summary</h5>
            <textarea name="summary" class="form-control" rows="3" placeholder="A brief professional summary..."></textarea>
        </div>

        <div class="card-premium mb-4">
            <h5 class="fw-bold mb-3">Experience</h5>
            <textarea name="experience[]" class="form-control mb-2" rows="2" placeholder="e.g. Software Engineer at Acme Corp, 2022-2024: Built and shipped..."></textarea>
            <textarea name="experience[]" class="form-control" rows="2" placeholder="Add another role (optional)"></textarea>
        </div>

        <div class="card-premium mb-4">
            <h5 class="fw-bold mb-3">Education</h5>
            <textarea name="education[]" class="form-control mb-2" rows="2" placeholder="e.g. B.E. Computer Science, AGMRCET, 2023-2027"></textarea>
            <textarea name="education[]" class="form-control" rows="2" placeholder="Add another entry (optional)"></textarea>
        </div>

        <div class="card-premium mb-4">
            <h5 class="fw-bold mb-3">Skills</h5>
            <input type="text" name="skills" class="form-control" placeholder="Comma-separated, e.g. Python, Flask, SQL, Git">
        </div>

        <div class="card-premium mb-4">
            <h5 class="fw-bold mb-3">Certifications</h5>
            <textarea name="certifications[]" class="form-control" rows="2" placeholder="e.g. AWS Certified Cloud Practitioner (optional)"></textarea>
        </div>

        <button type="submit" class="btn btn-premium">Generate Resume &amp; Analyze</button>
        <a href="{{ url_for('candidate.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
